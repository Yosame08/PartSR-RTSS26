[project]
name = "partsr"
version = "0.1.0"
description = "PartSR prototype and experiment pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "decord2==1.0.0",
    "flask>=3.0,<4",
    "flask-cors>=5,<7",
    "matplotlib>=3.8,<4",
    "motion-vector-extractor==1.0.6",
    "numpy>=1.24,<2",
    "opencv-contrib-python==4.5.5.64",
    "pandas>=2,<3",
    "pillow>=10,<12",
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
    "scikit-image>=0.21,<0.26",
    "scikit-learn>=1.3,<2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
cpu = [
    "basicsr==1.4.2",
    "cython>=3,<4",
    "setuptools>=65,<81",
    "torch==2.0.1",
    "torchvision==0.15.2",
    "wheel>=0.40,<1",
]
cu117 = [
    "basicsr==1.4.2",
    "cython>=3,<4",
    "setuptools>=65,<81",
    "torch==2.0.1",
    "torchvision==0.15.2",
    "wheel>=0.40,<1",
]

[tool.uv]
package = false
required-version = ">=0.12.0"
no-build-isolation-package = ["basicsr"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu117" },
    ],
]
# Both packages require the headless OpenCV API, while PartSR additionally needs
# cv2.legacy.TrackerMOSSE_create from the contrib wheel. Installing both OpenCV
# wheels is unsupported because they overwrite the same cv2 package.
exclude-dependencies = [
    { package = { name = "basicsr", version = "1.4.2" }, dependencies = ["opencv-python"] },
    { package = { name = "motion-vector-extractor", version = "1.0.6" }, dependencies = ["opencv-python"] },
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu117", extra = "cu117" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu117", extra = "cu117" },
]

[[tool.uv.dependency-metadata]]
name = "basicsr"
version = "1.4.2"
requires-dist = [
    "addict",
    "future",
    "lmdb",
    "numpy",
    "opencv-python",
    "pillow",
    "pyyaml",
    "requests",
    "scikit-image",
    "scipy",
    "tb-nightly",
    "torch",
    "torchvision",
    "tqdm",
    "yapf",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true
